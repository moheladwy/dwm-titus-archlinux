name: CodeQL

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep the image digest and archive date in step with
    # tests/containers/arch/Containerfile.
    container: docker.io/library/archlinux:base-devel@sha256:3cbf69d2d5958d6a294f3722c5668e6187c4df8e00fa27f72352f0bf83e495e1
    defaults:
      run:
        shell: bash
    env:
      ARCH_ARCHIVE_DATE: 2026/10/22

    steps:
      - name: Pin Arch Linux Archive snapshot and install checkout dependency
        run: |
          printf 'Server = https://archive.archlinux.org/repos/%s/$repo/os/$arch\n' \
            "$ARCH_ARCHIVE_DATE" >/etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm --needed --disable-download-timeout git

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          source scripts/dwm-packages.sh
          mapfile -t packages < <(dwm_packages arch build)
          pacman -Syu --noconfirm --needed --disable-download-timeout "${packages[@]}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.3
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build
        run: scripts/run-tests make clean all

      - name: Analyze
        uses: github/codeql-action/analyze@v4.38.3
