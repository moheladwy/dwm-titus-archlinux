name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Desktop smoke
    runs-on: ubuntu-latest
    # The Arch Linux Archive can be slower than a live mirror.
    timeout-minutes: 20
    # Keep the image digest and archive date in step with
    # tests/containers/arch/Containerfile.
    container: docker.io/library/archlinux:base-devel@sha256:3cbf69d2d5958d6a294f3722c5668e6187c4df8e00fa27f72352f0bf83e495e1
    defaults:
      run:
        shell: bash
    env:
      ARCH_ARCHIVE_DATE: 2026/10/22
      DWM_TEST_TMP_ROOT: /var/tmp/dwm-ci

    steps:
      - name: Pin Arch Linux Archive snapshot and install checkout dependency
        run: |
          printf 'Server = https://archive.archlinux.org/repos/%s/$repo/os/$arch\n' \
            "$ARCH_ARCHIVE_DATE" >/etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm --needed --disable-download-timeout git

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build and smoke dependencies
        run: |
          source scripts/dwm-packages.sh
          mapfile -t packages < <(dwm_packages arch ci-smoke)
          pacman -Syu --noconfirm --needed --disable-download-timeout "${packages[@]}"

      - name: Build dwm
        run: |
          scripts/run-tests make clean all
          chmod 0755 dwm

      - name: Launch desktop and check basic interaction
        timeout-minutes: 2
        run: |
          install -d -m 0700 -o nobody -g nobody /home/dwm-ci /run/dwm-ci "$DWM_TEST_TMP_ROOT"
          runuser -u nobody -- env HOME=/home/dwm-ci XDG_RUNTIME_DIR=/run/dwm-ci \
            scripts/run-tests timeout --kill-after=5s 90s python3 tests/test-desktop-smoke.py
